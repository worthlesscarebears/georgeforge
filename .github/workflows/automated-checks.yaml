name: Tests

on:
  push:
    branches:
      - "main"

    tags-ignore:
      - "**"

  pull_request:
    branches:
      - "**"

    tags-ignore:
      - "**"

jobs:
  # pre-commit Checks
  devenv-test:
    name: Devenv Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile install nixpkgs#devenv
      - name: Build the devenv shell and run any git hooks
        run: devenv test
